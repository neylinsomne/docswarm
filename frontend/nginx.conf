# nginx del frontend DocSwarm.
# Sirve el SPA (build de Vite) y hace reverse-proxy de la API al contenedor `api`
# por la red interna de Docker, de modo que el navegador habla con un único origen
# (sin CORS). Las rutas de FastAPI se reenvían tal cual.

upstream docswarm_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño de subida para /api/v1/documentos
    client_max_body_size 50m;

    # ---- API y rutas del backend → contenedor api:8000 ----
    location /api/ {
        proxy_pass http://docswarm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # generación ACP / embeddings pueden tardar
    }

    # Salud + documentación interactiva del backend (mismo host)
    location = /health { proxy_pass http://docswarm_api/health; }
    location /health/ { proxy_pass http://docswarm_api; }
    location = /openapi.json { proxy_pass http://docswarm_api/openapi.json; }
    location /docs { proxy_pass http://docswarm_api; }
    location /redoc { proxy_pass http://docswarm_api; }

    # ---- SPA: history fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SIEMPRE revalida (evita servir un build viejo desde caché).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Cache de assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
