# Flyway · configuración de migraciones (gestión documental B2B)
# Las credenciales reales llegan por variables de entorno en docker-compose
# (FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD). Estos valores son el fallback local.

flyway.url=jdbc:postgresql://postgres:5432/docswarm
flyway.user=postgres
flyway.password=postgres
flyway.locations=filesystem:/flyway/sql
flyway.schemas=public
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
# Validar checksums antes de migrar; ordena versionadas y repetibles.
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
